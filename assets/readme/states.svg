<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="t d"><title id="t">LSpoof's four states</title><desc id="d">Off goes to Holding with Apply location, or to Moving with Start route. Holding goes to Moving with Start route. Moving goes to Paused when you pause or leave the app, and back with Resume. Moving goes to Holding when the route arrives or you tap Hold here. Turn off goes back to Off from any state.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.fb{transform-box:fill-box;transform-origin:center}.fl{transform-box:fill-box;transform-origin:0 50%}@keyframes k-ns0{0.000%{stroke-opacity:.18}0.001%{stroke-opacity:.18}3.750%{stroke-opacity:.95}23.750%{stroke-opacity:.95}27.500%{stroke-opacity:.18}100.000%{stroke-opacity:.18}}.ns0{animation:k-ns0 8.0s linear infinite}@keyframes k-ns1{0.000%{stroke-opacity:.18}25.000%{stroke-opacity:.18}28.750%{stroke-opacity:.95}48.750%{stroke-opacity:.95}52.500%{stroke-opacity:.18}100.000%{stroke-opacity:.18}}.ns1{animation:k-ns1 8.0s linear infinite}@keyframes k-ns2{0.000%{stroke-opacity:.18}50.000%{stroke-opacity:.18}53.750%{stroke-opacity:.95}73.750%{stroke-opacity:.95}77.500%{stroke-opacity:.18}100.000%{stroke-opacity:.18}}.ns2{animation:k-ns2 8.0s linear infinite}@keyframes k-ns3{0.000%{stroke-opacity:.18}75.000%{stroke-opacity:.18}78.750%{stroke-opacity:.95}98.750%{stroke-opacity:.95}100.000%{stroke-opacity:.18}100.000%{stroke-opacity:.18}}.ns3{animation:k-ns3 8.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style><defs><linearGradient id="bgs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1629"/><stop offset=".55" stop-color="#0a0f1d"/><stop offset="1" stop-color="#0c1222"/></linearGradient><radialGradient id="glows" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#34d399" stop-opacity=".34"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient><pattern id="grids" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><path d="M0 0H56M0 0V56" stroke="#94a3b8" stroke-opacity=".07" stroke-width="1.2"/></pattern><clipPath id="cards"><rect width="960" height="310" rx="28"/></clipPath></defs><g clip-path="url(#cards)"><rect width="960" height="310" fill="url(#bgs)"/><rect width="960" height="310" fill="url(#grids)"/></g><rect x=".75" y=".75" width="958.5" height="308.5" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1.5"/><rect class="ns0" x="44" y="122" width="150" height="56" rx="28.0" fill="#8b93a7" fill-opacity=".12" stroke="#8b93a7" stroke-opacity=".18" stroke-width="2"/><circle cx="72" cy="150.0" r="7" fill="#8b93a7"/><text x="90" y="157.0" font-size="20" font-weight="750" fill="#f5f7fb">Off</text><rect class="ns1" x="284" y="122" width="150" height="56" rx="28.0" fill="#4f8bff" fill-opacity=".12" stroke="#4f8bff" stroke-opacity=".18" stroke-width="2"/><circle cx="312" cy="150.0" r="7" fill="#4f8bff"/><text x="330" y="157.0" font-size="20" font-weight="750" fill="#f5f7fb">Holding</text><rect class="ns2" x="524" y="122" width="150" height="56" rx="28.0" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".18" stroke-width="2"/><circle cx="552" cy="150.0" r="7" fill="#34d399"/><text x="570" y="157.0" font-size="20" font-weight="750" fill="#f5f7fb">Moving</text><rect class="ns3" x="764" y="122" width="150" height="56" rx="28.0" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".18" stroke-width="2"/><circle cx="792" cy="150.0" r="7" fill="#f59e0b"/><text x="810" y="157.0" font-size="20" font-weight="750" fill="#f5f7fb">Paused</text><path d="M194 150.0H280" stroke="#c9d1e3" stroke-opacity=".45" stroke-width="2" fill="none"/><path d="M284 150.0l-9 -5v10z" fill="#c9d1e3" fill-opacity=".75" transform="rotate(0 284 150.0)"/><text x="239.0" y="112" font-size="14.5" fill="#aeb7ca" text-anchor="middle">Apply location</text><path d="M434 150.0H520" stroke="#c9d1e3" stroke-opacity=".45" stroke-width="2" fill="none"/><path d="M524 150.0l-9 -5v10z" fill="#c9d1e3" fill-opacity=".75" transform="rotate(0 524 150.0)"/><text x="479.0" y="112" font-size="14.5" fill="#aeb7ca" text-anchor="middle">Start route</text><path d="M674 141.0H760" stroke="#c9d1e3" stroke-opacity=".45" stroke-width="2" fill="none"/><path d="M764 141.0l-9 -5v10z" fill="#c9d1e3" fill-opacity=".75" transform="rotate(0 764 141.0)"/><text x="719.0" y="112" font-size="14.5" fill="#aeb7ca" text-anchor="middle">Pause, or leave the app</text><path d="M764 159.0H678" stroke="#c9d1e3" stroke-opacity=".45" stroke-width="2" fill="none"/><path d="M674 159.0l-9 -5v10z" fill="#c9d1e3" fill-opacity=".75" transform="rotate(180 674 159.0)"/><text x="719.0" y="200" font-size="14.5" fill="#aeb7ca" text-anchor="middle">Resume</text><path d="M119.0 122C119.0 50 599.0 50 599.0 118" stroke="#c9d1e3" stroke-opacity=".45" stroke-width="2" fill="none"/><path d="M599.0 122l-9 -5v10z" fill="#c9d1e3" fill-opacity=".75" transform="rotate(90 599.0 122)"/><text x="359.0" y="56" font-size="14.5" fill="#aeb7ca" text-anchor="middle">Start route</text><path d="M599.0 178C599.0 262 359.0 262 359.0 182" stroke="#c9d1e3" stroke-opacity=".45" stroke-width="2" fill="none"/><path d="M359.0 178l-9 -5v10z" fill="#c9d1e3" fill-opacity=".75" transform="rotate(-90 359.0 178)"/><text x="479.0" y="264" font-size="14.5" fill="#aeb7ca" text-anchor="middle">Arrive, or Hold here</text><text x="916" y="294" font-size="13" fill="#6b7489" text-anchor="end">Turn off goes back to Off from any state.</text></svg>
